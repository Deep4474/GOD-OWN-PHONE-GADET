[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Access-Control-Allow-Origin = "*"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
      style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com;
      img-src 'self' data: https: blob:;
      font-src 'self' https://cdnjs.cloudflare.com;
      form-action 'self';
      connect-src 'self' https://*.supabase.co wss://*.supabase.co https://jlwxkykznyjmstpjcgks.supabase.co;
      object-src 'none';
      frame-ancestors 'none';
      base-uri 'self';
      frame-src 'none';
      media-src 'none';
      manifest-src 'self';
      worker-src 'none';
      prefetch-src 'self';
      upgrade-insecure-requests;
      block-all-mixed-content;
      """
    Cache-Control = "no-store, max-age=0"
    Permissions-Policy = """
      accelerometer=(),
      ambient-light-sensor=(),
      autoplay=(),
      battery=(),
      camera=(),
      cross-origin-isolated=(),
      display-capture=(),
      document-domain=(),
      encrypted-media=(),
      execution-while-not-rendered=(),
      execution-while-out-of-viewport=(),
      fullscreen=(),
      geolocation=(),
      gyroscope=(),
      keyboard-map=(),
      magnetometer=(),
      microphone=(),
      midi=(),
      navigation-override=(),
      payment=(),
      picture-in-picture=(),
      publickey-credentials-get=(),
      screen-wake-lock=(),
      sync-xhr=(self),
      usb=(),
      web-share=(),
      xr-spatial-tracking=(),
      clipboard-read=(),
      clipboard-write=(),
      gamepad=(),
      speaker-selection=(),
      conversion-measurement=(),
      focus-without-user-activation=(),
      hid=(),
      idle-detection=(),
      interest-cohort=(),
      serial=(),
      sync-script=(),
      trust-token-redemption=(),
      window-placement=(),
      vertical-scroll=()
      """

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
