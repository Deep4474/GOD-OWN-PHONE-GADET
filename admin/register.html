<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - God's Own Phone Gadget Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Admin registration styles */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        .auth-body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .auth-box h1 {
            margin: 0 0 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            margin-top: 5px;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 15px;
            }

            .auth-box {
                padding: 20px;
            }

            .form-group input {
                font-size: 16px;
                padding: 12px;
            }

            .auth-button {
                padding: 15px;
                margin-top: 10px;
            }

            .error-message,
            .success-message {
                font-size: 14px;
                padding: 12px;
            }
        }

        .error-message {
            color: #dc3545;
            margin-bottom: 15px;
            display: none;
            padding: 10px;
            background-color: rgba(220, 53, 69, 0.1);
            border-radius: 4px;
        }

        .success-message {
            color: #28a745;
            margin-bottom: 15px;
            display: none;
            padding: 10px;
            background-color: rgba(40, 167, 69, 0.1);
            border-radius: 4px;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .auth-button:hover {
            background: #0056b3;
        }

        .auth-button:disabled {
            background: #cccccc;
            cursor: not-allowed;
        }

        .auth-links {
            margin-top: 20px;
            text-align: center;
        }

        .auth-links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <h1>Admin Registration</h1>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" required autocomplete="name" inputmode="text">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email" inputmode="email">
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required autocomplete="tel" inputmode="tel" pattern="[0-9]*">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required minlength="6" autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
                </div>
                <div class="error-message" id="registerError"></div>
                <div class="success-message" id="registerSuccess"></div>
                <button type="submit" class="auth-button">Register</button>
            </form>
            <div class="auth-links">
                <a href="login.html">Already have an account? Login</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Initialize Supabase Client for admin
        const supabaseUrl = 'https://jlwxkykznyjmstpjcgks.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impsd3hreWt6bnlqbXN0cGpjZ2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQzMTAxNDIsImV4cCI6MjA2OTg4NjE0Mn0.C86cvOOT5QI0PSHlPMujivWV8NLWMtgNiX8KrglzhIQ';

        // Create Supabase client properly
        const { createClient } = supabase;
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // Handle admin registration
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const errorDiv = document.getElementById('registerError');
            const submitButton = document.querySelector('.auth-button');

            try {
                // Reset error display
                errorDiv.style.display = 'none';
                
                // Validate inputs
                if (password !== confirmPassword) {
                    throw new Error('Passwords do not match');
                }

                if (password.length < 6) {
                    throw new Error('Password must be at least 6 characters long');
                }

                // Show loading state
                submitButton.disabled = true;
                submitButton.textContent = 'Creating Account...';

                // Create user account
                const { data: { user }, error: signUpError } = await supabaseClient.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            isAdmin: true // Set admin flag
                        }
                    }
                });

                if (signUpError) throw signUpError;

                if (!user) {
                    throw new Error('Failed to create account');
                }

                // Show success message
                errorDiv.textContent = 'Registration successful! Redirecting to login...';
                errorDiv.style.color = '#28a745';
                errorDiv.style.display = 'block';

                // Clear form
                document.getElementById('registerForm').reset();

                // Redirect to login after a delay
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Registration error:', error);
                errorDiv.textContent = error.message || 'Failed to create account. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Register';
            }
        });

        // Check if already logged in
        window.addEventListener('load', async () => {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (session && session.user?.user_metadata?.isAdmin) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        });
    </script>
</body>
</html>
