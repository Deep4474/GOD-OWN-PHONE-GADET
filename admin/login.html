<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - God's Own Phone Gadget Admin</title>
    <style>
        /* Admin login styles */
        .auth-body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .auth-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .auth-box h1 {
            margin: 0 0 20px;
            color: #333;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .error-message {
            color: #dc3545;
            margin-bottom: 15px;
            display: none;
        }

        .auth-button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .auth-button:hover {
            background: #0056b3;
        }

        .auth-links {
            margin-top: 20px;
            text-align: center;
        }

        .auth-links a {
            color: #007bff;
            text-decoration: none;
            margin: 0 10px;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-box">
            <h1>Admin Login</h1>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <div class="error-message" id="loginError"></div>
                <button type="submit" class="auth-button">Login</button>
            </form>
            <div class="auth-links">
                <a href="register.html">Register</a>
                <a href="#" id="forgotPassword">Forgot Password?</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="admin-config.js"></script>
    <script>

        // Handle admin login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('loginError');
            const submitButton = document.querySelector('.auth-button');

            try {
                // Validate inputs
                if (!email || !password) {
                    throw new Error('Please fill in all fields');
                }

                // Show loading state
                submitButton.disabled = true;
                submitButton.textContent = 'Logging in...';
                errorDiv.style.display = 'none';

                // Try to sign in
                const { data: { session }, error } = await window.supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    console.error('Sign in error:', error);
                    throw new Error('Invalid login credentials');
                }

                if (!session) {
                    throw new Error('No session created');
                }

                // Get the user data after successful login
                const { data: { user }, error: userError } = await window.supabaseClient.auth.getUser();
                
                if (userError || !user) {
                    throw new Error('Failed to get user data');
                }

                if (!user.user_metadata?.isAdmin) {
                    // Sign out if not an admin
                    await window.supabaseClient.auth.signOut();
                    throw new Error('Unauthorized: Admin access only');
                }

                if (error) {
                    console.error('Sign in error:', error);
                    throw new Error('Invalid login credentials');
                }

                if (!session) {
                    throw new Error('No session created');
                }

                // Store admin session
                localStorage.setItem('admin-token', session.access_token);
                localStorage.setItem('admin-refresh-token', session.refresh_token);
                
                // Show success message before redirect
                errorDiv.textContent = 'Login successful! Redirecting...';
                errorDiv.style.color = '#28a745';
                errorDiv.style.display = 'block';

                // Redirect to admin panel after a short delay
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                
                // Handle different types of errors
                let errorMessage = 'Failed to login. Please try again.';
                
                if (!navigator.onLine) {
                    errorMessage = 'Please check your internet connection and try again.';
                } else if (error.message.includes('Invalid login credentials')) {
                    errorMessage = 'Invalid email or password.';
                } else if (error.message.includes('Unauthorized')) {
                    errorMessage = 'This account does not have admin access.';
                } else if (error.message.includes('rate limit')) {
                    errorMessage = 'Too many login attempts. Please try again later.';
                }

                // Show error message with improved styling
                errorDiv.textContent = errorMessage;
                errorDiv.style.display = 'block';
                errorDiv.style.color = '#dc3545';
                errorDiv.style.padding = '10px';
                errorDiv.style.backgroundColor = 'rgba(220, 53, 69, 0.1)';
                errorDiv.style.borderRadius = '4px';

                // Vibrate on mobile for error feedback
                if (navigator.vibrate) {
                    navigator.vibrate(200);
                }
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = 'Login';
            }
        });

        // Check if already logged in
        window.addEventListener('load', async () => {
            try {
                const { data: { session }, error } = await supabaseClient.auth.getSession();
                if (session && session.user?.user_metadata?.isAdmin) {
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Session check error:', error);
            }
        });
    </script>
</body>
</html>
