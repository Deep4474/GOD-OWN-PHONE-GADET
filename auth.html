
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#3498db">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>Login - God's Own Phone Gadget</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="auth.mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">
            <a href="index.html"><h1>God's Own Phone Gadgets</h1></a>
        </div>
        <button class="mobile-menu-btn" aria-label="Toggle menu">
            <i class="fas fa-bars"></i>
        </button>
        <ul class="nav-links">
            <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
            <li><a href="index.html#products"><i class="fas fa-mobile-alt"></i> Products</a></li>
            <li><a href="index.html#deals"><i class="fas fa-tag"></i> Special Deals</a></li>
            <li><a href="index.html#contact"><i class="fas fa-envelope"></i> Contact</a></li>
        </ul>
    </nav>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="index.html#products" class="nav-item">
            <i class="fas fa-mobile-alt"></i>
            <span>Products</span>
        </a>
        <a href="index.html#deals" class="nav-item">
            <i class="fas fa-tag"></i>
            <span>Deals</span>
        </a>
        <a href="index.html#contact" class="nav-item">
            <i class="fas fa-envelope"></i>
            <span>Contact</span>
        </a>
    </nav>

    <div class="auth-container">
        <!-- Login Form -->
        <div class="auth-box" id="loginBox">
            <h2>Login</h2>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" required>
                </div>
                <div class="error-message" id="loginError"></div>
                <div class="success-message" id="loginSuccess"></div>
                <button type="submit" class="auth-button">Send Login Link</button>
                <div class="auth-links">
                    <a href="#" id="showRegister">Don't have an account? Register</a>
                </div>
            </form>
        </div>

        <!-- Confirmation Box -->
        <div class="auth-box hidden" id="confirmationBox">
            <h2>Confirm Login</h2>
            <p class="confirmation-message">Did you request to login to God's Own Phone Gadget?</p>
            <div class="confirmation-buttons">
                <button id="confirmYes" class="auth-button confirm-yes">Yes, I'm the one</button>
                <button id="confirmNo" class="auth-button confirm-no">No, I'm not the one</button>
            </div>
            <div class="error-message" id="confirmError"></div>
        </div>

        <!-- Register Form -->
        <div class="auth-box hidden" id="registerBox">
            <h2>Register</h2>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="regFullName">Full Name</label>
                    <input type="text" id="regFullName" required>
                </div>
                <div class="form-group">
                    <label for="regEmail">Email</label>
                    <input type="email" id="regEmail" required>
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="regPhone">Phone Number</label>
                    <input type="tel" id="regPhone" required>
                </div>
                <div class="error-message" id="registerError"></div>
                <button type="submit" class="auth-button">Register</button>
                <div class="auth-links">
                    <a href="#" id="showLogin">Already have an account? Login</a>
                </div>
            </form>
        </div>

        <!-- Email Verification Form -->
        <div class="auth-box hidden" id="verificationBox">
            <h2>Email Verification</h2>
            <form id="verificationForm" class="auth-form">
                <div class="form-group">
                    <label for="verificationEmail">Email</label>
                    <input type="email" id="verificationEmail" required>
                </div>
                <div id="otpInputContainer" class="form-group hidden">
                    <label for="verificationCode">Enter Verification Code</label>
                    <input type="text" id="verificationCode" required maxlength="6" pattern="[0-9]{6}" placeholder="Enter 6-digit code">
                </div>
                <div class="error-message" id="verificationError"></div>
                <div class="success-message" id="verificationSuccess"></div>
                <button type="submit" id="sendVerificationBtn" class="auth-button">Send Verification Code</button>
                <div class="auth-links">
                    <a href="#" id="backToLoginFromVerification">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth_config.js"></script>
    <script src="config.js"></script>
    <script src="authService.js"></script>
    <script src="auth.js"></script>
    <script>
        // Verify Supabase client initialization
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Test the Supabase connection
                const { data, error } = await supabaseClient.auth.getSession();
                if (error) {
                    throw error;
                }
                console.log('Supabase connection successful');
            } catch (error) {
                console.error('Supabase connection error:', error);
                document.getElementById('loginError').textContent = 'Authentication service not available';
            }
        });
    </script>
    <script>
        // Check for errors
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            console.error('Error: ' + msg + '\nURL: ' + url + '\nLine: ' + lineNo + '\nColumn: ' + columnNo + '\nError object: ' + JSON.stringify(error));
            return false;
        };
    </script>
</body>
</html>
